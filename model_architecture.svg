<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6a3dad"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #182026; text-anchor: middle; }
      .title { font-size: 27px; font-weight: 700; }
      .main { font-size: 22px; font-weight: 700; }
      .sub { font-size: 17px; font-weight: 400; }
      .tiny { font-size: 15px; font-weight: 400; }
      .box { stroke-width: 2.4; rx: 16; ry: 16; }
      .camera { fill: #fff3df; stroke: #d77900; }
      .lidar { fill: #eaf4ff; stroke: #2878b5; }
      .fusion { fill: #f3ebff; stroke: #6a3dad; }
      .neutral { fill: #f6f7f8; stroke: #59636b; }
      .output { fill: #eaf8ee; stroke: #2f7d44; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2.5; marker-end: url(#arrow); }
      .fusion-arrow { fill: none; stroke: #6a3dad; stroke-width: 2.7; marker-end: url(#arrow-purple); }
      .skip { fill: none; stroke: #2878b5; stroke-width: 2.4; stroke-dasharray: 10 7; marker-end: url(#arrow); }
      .training { fill: none; stroke: #777; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Modality labels -->
  <text class="label title" x="115" y="88">Camera branch</text>
  <text class="label title" x="115" y="543">LiDAR branch</text>

  <!-- Camera branch -->
  <rect class="box camera" x="35" y="125" width="160" height="105"/>
  <text class="label main" x="115" y="169">RGB image</text>
  <text class="label sub" x="115" y="200">max 1280 × 384</text>

  <path class="arrow" d="M195 177 L245 177"/>
  <rect class="box camera" x="245" y="125" width="180" height="105"/>
  <text class="label main" x="335" y="169">ResNet-18</text>
  <text class="label sub" x="335" y="200">ImageNet pretrained</text>

  <path class="arrow" d="M425 177 L475 177"/>
  <rect class="box camera" x="475" y="105" width="255" height="145"/>
  <text class="label main" x="602" y="149">Camera-to-BEV</text>
  <text class="label main" x="602" y="179">alignment</text>
  <text class="label sub" x="602" y="211">KITTI calibration</text>
  <text class="label sub" x="602" y="234">4 height queries</text>

  <path class="arrow" d="M730 177 L780 177"/>
  <rect class="box camera" x="780" y="125" width="200" height="105"/>
  <text class="label main" x="880" y="166">Camera tokens</text>
  <text class="label sub" x="880" y="198">16 × 16, 128-D</text>

  <!-- Training-only auxiliary camera supervision -->
  <path class="training" d="M602 250 L602 305"/>
  <rect class="box neutral" x="480" y="305" width="245" height="92"/>
  <text class="label main" x="602" y="340">Camera-BEV center</text>
  <text class="label sub" x="602" y="370">auxiliary loss, weight 0.25</text>
  <text class="label tiny" x="602" y="418">training only</text>

  <!-- LiDAR branch -->
  <rect class="box lidar" x="35" y="580" width="160" height="105"/>
  <text class="label main" x="115" y="623">Point cloud</text>
  <text class="label sub" x="115" y="654">x, y, z, intensity</text>

  <path class="arrow" d="M195 632 L235 632"/>
  <rect class="box lidar" x="235" y="565" width="215" height="135"/>
  <text class="label main" x="342" y="608">PillarFeatureNet</text>
  <text class="label sub" x="342" y="640">pillar encoding</text>
  <text class="label sub" x="342" y="670">and BEV scatter</text>

  <path class="arrow" d="M450 632 L490 632"/>
  <rect class="box lidar" x="490" y="565" width="220" height="135"/>
  <text class="label main" x="600" y="608">SECOND</text>
  <text class="label main" x="600" y="638">+ SECONDFPN</text>
  <text class="label sub" x="600" y="670">384-channel BEV</text>

  <path class="arrow" d="M710 632 L750 632"/>
  <rect class="box lidar" x="750" y="565" width="230" height="135"/>
  <text class="label main" x="865" y="607">Projection +</text>
  <text class="label main" x="865" y="637">BEV pooling</text>
  <text class="label sub" x="865" y="670">16 × 16, 128-D tokens</text>

  <!-- Fusion module -->
  <rect class="box fusion" x="1030" y="95" width="425" height="610"/>
  <text class="label title" x="1242" y="140">Symmetric attention-bottleneck fusion</text>
  <text class="label sub" x="1242" y="171">8 attention heads per layer</text>

  <path class="fusion-arrow" d="M980 177 L1010 177 L1010 257 L1080 257"/>
  <path class="fusion-arrow" d="M980 632 L1010 632 L1010 562 L1080 562"/>

  <rect class="box camera" x="1080" y="205" width="325" height="105"/>
  <text class="label main" x="1242" y="248">Camera transformer</text>
  <text class="label sub" x="1242" y="280">camera tokens + shared tokens</text>

  <rect class="box fusion" x="1130" y="360" width="225" height="100"/>
  <text class="label main" x="1242" y="401">4 shared</text>
  <text class="label main" x="1242" y="432">bottleneck tokens</text>

  <rect class="box lidar" x="1080" y="510" width="325" height="105"/>
  <text class="label main" x="1242" y="553">LiDAR transformer</text>
  <text class="label sub" x="1242" y="585">LiDAR tokens + shared tokens</text>

  <path class="fusion-arrow" d="M1325 310 L1325 360"/>
  <path class="fusion-arrow" d="M1325 510 L1325 460"/>
  <text class="label tiny" x="1158" y="337">average branch updates</text>

  <path class="fusion-arrow" d="M1355 410 L1420 410 L1420 257 L1405 257"/>
  <path class="fusion-arrow" d="M1130 410 L1055 410 L1055 562 L1080 562"/>
  <path class="fusion-arrow" d="M1110 650 L1380 650 L1380 692 L1110 692 L1110 650"/>
  <text class="label tiny" x="1245" y="676">repeat shared bottleneck update ×4</text>

  <!-- Readout and detection -->
  <path class="fusion-arrow" d="M1455 410 L1495 410"/>
  <rect class="box fusion" x="1495" y="345" width="260" height="130"/>
  <text class="label main" x="1625" y="385">LiDAR readout</text>
  <text class="label main" x="1625" y="415">cross-attention</text>
  <text class="label sub" x="1625" y="447">LiDAR queries; bottleneck K/V</text>

  <path class="arrow" d="M1625 475 L1625 525"/>
  <rect class="box neutral" x="1495" y="525" width="260" height="110"/>
  <text class="label main" x="1625" y="566">1 × 1 residual</text>
  <text class="label main" x="1625" y="596">projection to 384-D</text>
  <text class="label sub" x="1625" y="620">add to original LiDAR BEV</text>

  <path class="arrow" d="M1625 635 L1625 685"/>
  <rect class="box output" x="1495" y="685" width="260" height="105"/>
  <text class="label main" x="1625" y="728">PointPillars</text>
  <text class="label main" x="1625" y="758">3D detection head</text>

  <path class="arrow" d="M1625 790 L1625 830"/>
  <rect class="box output" x="1450" y="830" width="350" height="80"/>
  <text class="label main" x="1625" y="864">3D boxes · classes · scores · orientation</text>
  <text class="label sub" x="1625" y="892">Car · Pedestrian · Cyclist</text>

  <!-- LiDAR residual skip -->
  <path class="skip" d="M600 700 L600 780 L1470 780 L1470 590 L1495 590"/>
  <text class="label tiny" x="1015" y="767">original 384-channel LiDAR BEV residual path</text>
</svg>
